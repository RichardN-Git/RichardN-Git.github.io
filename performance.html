<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Swarm — Performance</title>

  <link id="mainStyleSheet" rel="stylesheet" href="style2.css">
  <script src="functions.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>

  <style>
    .chart-wrapper {
      position: relative;
      height: 420px;
      margin: 1.5rem 0;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .stat-card .label {
      font-size: 0.8rem;
      margin-bottom: 0.4rem;
    }

    .stat-card .value {
      font-size: 1.4rem;
      font-weight: bold;
    }

    body.light-theme main {
      margin-left: 265px;
      margin-right: 30px;
      padding: 2rem;
    }

    body.light-theme .stat-card {
      background-color: #ffffff;
      color: #333;
      border: 2px solid #97202c;
      border-radius: 64px 12px 48px 12px;
      box-shadow: 0 14px 36px rgba(151, 32, 44, 0.14);
    }

    body.light-theme .stat-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 44px rgba(151, 32, 44, 0.2);
    }

    body.light-theme .stat-card .label { color: #97202c; }
    body.light-theme .stat-card .value { color: #333; }

    body.dark-theme main {
      padding: 2rem;
      margin: 0 auto;
    }

    body.dark-theme .stat-card {
      background-color: #0E2A1D;
      color: #ffffff;
      border: 2px solid #126127;
      border-radius: 10px;
      box-shadow: none;
    }

    body.dark-theme .stat-card:hover {
      transform: translateY(-6px);
    }

    body.dark-theme .stat-card .label { color: rgba(255, 255, 255, 0.6); }
    body.dark-theme .stat-card .value { color: #ffffff; }

    .positive { color: #2a9d5c; }
    .negative { color: #e05252; }

    .updated-at {
      font-size: 0.75rem;
      color: #999;
      text-align: right;
      margin-top: 0.5rem;
    }

    body.dark-theme .updated-at {
      color: rgba(255, 255, 255, 0.5);
    }

    #performanceChart {
      background: transparent;
    }

    @media (max-width: 768px) {
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="nav-container">

        <!-- Site Name, considering logo in future -->
        <div class="logo">
            Navigate
        </div>

        <!-- Hamburger Toggle -->
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <!-- Links to the other pages -->
        <ul class="nav-links">
            <li><a href="index.html">Landing</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="qualifications.html">Qualifications</a></li>
            <li><a href="service.html">Service</a></li>
            <li><a href="performance.html">Quant</a></li>
            <li>
                <button class="style-toggle" onclick="toggleStyleSheet()">
                    Toggle Style
                </button>
            </li>
        </ul>

    </div>
</nav>

  <div class="square-background"></div>

  <main>
    <div class="box description-box">
      <h2>Stock Swarm Performance</h2>
      <p>
        My Sentiment Quant Model vs S&P 500 benchmark.
        Paper trades executed via Alpaca. Updated after market close on trading days.
      </p>
    </div>

    <br>

    <div class="stats-row" id="stats-row">
      <!-- Populated by JS -->
    </div>

    <div class="box">
      <div class="chart-wrapper">
        <canvas id="performanceChart"></canvas>
      </div>
      <p class="updated-at" id="updated-at"></p>
    </div>
  </main>

  <script>
    // ----- Theme detection -----
    function isDarkMode() {
      const href = document.getElementById("mainStyleSheet")?.getAttribute("href") || "";
      return href.includes("style1");
    }

    // Tag <body> so the stat-card CSS rules apply to the right theme.
    function applyThemeClass() {
      const dark = isDarkMode();
      document.body.classList.toggle("dark-theme",  dark);
      document.body.classList.toggle("light-theme", !dark);
    }

    applyThemeClass(); // initial paint

    // ----- Chart reference so we can restyle it on theme swap -----
    let perfChart = null;

    function updateChartTheme() {
      if (!perfChart) return;
      const dark = isDarkMode();
      const swarmColour = dark ? "#7CFFB2" : "#97202c";
      const spyColour   = dark ? "#4a90d9" : "#2a6ebb";
      const gridColour  = dark ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.08)";
      const textColour  = dark ? "#ffffff" : "#000000"; // pure black in light theme

      perfChart.data.datasets[0].borderColor     = swarmColour;
      perfChart.data.datasets[0].backgroundColor = swarmColour + "18";
      perfChart.data.datasets[1].borderColor     = spyColour;
      perfChart.data.datasets[1].backgroundColor = spyColour + "18";

      perfChart.options.plugins.legend.labels.color = textColour;
      perfChart.options.scales.x.grid.color         = gridColour;
      perfChart.options.scales.x.ticks.color        = textColour;
      perfChart.options.scales.y.grid.color         = gridColour;
      perfChart.options.scales.y.ticks.color        = textColour;

      perfChart.update();
    }

    // Watch the stylesheet <link> for href changes
    const linkEl = document.getElementById("mainStyleSheet");
    if (linkEl) {
      new MutationObserver(function () {
        applyThemeClass();
        updateChartTheme();
      }).observe(linkEl, { attributes: true, attributeFilter: ["href"] });
    }

    // ----- Data load + render -----
    async function loadAndRender() {
      let data;
      try {
        const response = await fetch("performance_data.json");
        if (!response.ok) throw new Error("not found");
        data = await response.json();
      } catch (e) {
        document.querySelector("main").innerHTML +=
          `<div class="box"><p>Performance data not available yet. Run fetch_performance.py to generate it.</p></div>`;
        return;
      }

      const portfolio = data.portfolio;
      const spy       = data.spy;

      if (!portfolio?.length || !spy?.length) {
        document.querySelector("main").innerHTML +=
          `<div class="box"><p>No data points found in performance_data.json.</p></div>`;
        return;
      }

      const portfolioReturn = ((portfolio.at(-1).value - portfolio[0].value) / portfolio[0].value) * 100;
      const spyReturn       = ((spy.at(-1).value       - spy[0].value)       / spy[0].value)       * 100;
      const alpha           = portfolioReturn - spyReturn;
      const currentValue    = portfolio.at(-1).value;

      function statCard(label, value, isPercent, coloured) {
        const formatted = isPercent
          ? (value >= 0 ? "+" : "") + value.toFixed(2) + "%"
          : "$" + value.toLocaleString("en-US", { minimumFractionDigits: 2 });
        const cls = coloured ? (value >= 0 ? "positive" : "negative") : "";
        return `
          <div class="stat-card">
            <div class="label">${label}</div>
            <div class="value ${cls}">${formatted}</div>
          </div>`;
      }

      document.getElementById("stats-row").innerHTML =
        statCard("Portfolio Value",   currentValue,    false, false) +
        statCard("Swarm Return",      portfolioReturn, true,  true)  +
        statCard("S&P 500 Return",    spyReturn,       true,  true)  +
        statCard("Alpha",             alpha,           true,  true);

      // --- Chart ---
      const dark = isDarkMode();
      const swarmColour = dark ? "#7CFFB2" : "#97202c";
      const spyColour   = dark ? "#4a90d9" : "#2a6ebb";
      const gridColour  = dark ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.08)";
      const textColour  = dark ? "#ffffff" : "#000000";

      const ctx = document.getElementById("performanceChart").getContext("2d");

      perfChart = new Chart(ctx, {
        type: "line",
        data: {
          datasets: [
            {
              label: "Stock Swarm (paper)",
              data: portfolio.map(d => ({ x: d.date, y: d.value })),
              borderColor:     swarmColour,
              backgroundColor: swarmColour + "18",
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.1,
              fill: true,
            },
            {
              label: "S&P 500 (SPY)",
              data: spy.map(d => ({ x: d.date, y: d.value })),
              borderColor:     spyColour,
              backgroundColor: spyColour + "18",
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.1,
              fill: true,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: {
              position: "top",
              labels: { color: textColour },
            },
            tooltip: {
              callbacks: {
                label: ctx =>
                  `${ctx.dataset.label}: $${ctx.parsed.y.toLocaleString("en-US", { minimumFractionDigits: 2 })}`,
              },
            },
          },
          scales: {
            x: {
              type: "time",
              time: { unit: "month", tooltipFormat: "MMM d, yyyy" },
              grid: { color: gridColour },
              ticks: { color: textColour },
            },
            y: {
              grid: { color: gridColour },
              ticks: {
                color: textColour,
                callback: v => "$" + v.toLocaleString("en-US", { minimumFractionDigits: 0 }),
              },
            },
          },
        },
      });

      const generated = new Date(data.generated_at);
      document.getElementById("updated-at").textContent =
        "Last updated: " + generated.toLocaleDateString("en-US", {
          year: "numeric", month: "long", day: "numeric"
        });
    }

    loadAndRender();
  </script>

</body>
</html>
